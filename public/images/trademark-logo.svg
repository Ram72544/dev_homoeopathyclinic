<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- True transparent glass: nearly invisible body, visible only at edges -->
    <linearGradient id="glassEdgeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A5E5D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A5E5D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassEdgeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A5E5D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A5E5D" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glassBottomCurve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7C7B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0E7C7B" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Cap: brushed teal metal -->
    <linearGradient id="capBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#053B3A"/>
      <stop offset="15%" stop-color="#0E6B6A"/>
      <stop offset="30%" stop-color="#1A9896"/>
      <stop offset="45%" stop-color="#2BB8B5"/>
      <stop offset="55%" stop-color="#3DCCC8"/>
      <stop offset="70%" stop-color="#1A9896"/>
      <stop offset="85%" stop-color="#0B6261"/>
      <stop offset="100%" stop-color="#042E2D"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AD4CF"/>
      <stop offset="50%" stop-color="#2AABA7"/>
      <stop offset="100%" stop-color="#0B6A69"/>
    </linearGradient>
    <linearGradient id="capRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ECAC5"/>
      <stop offset="100%" stop-color="#063F3E"/>
    </linearGradient>

    <!-- Leaves -->
    <linearGradient id="leafL" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#163D22"/>
      <stop offset="25%" stop-color="#24662F"/>
      <stop offset="50%" stop-color="#3A943F"/>
      <stop offset="75%" stop-color="#58B84E"/>
      <stop offset="100%" stop-color="#7ED06A"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A4226"/>
      <stop offset="25%" stop-color="#286E34"/>
      <stop offset="50%" stop-color="#409C44"/>
      <stop offset="75%" stop-color="#60C056"/>
      <stop offset="100%" stop-color="#82D870"/>
    </linearGradient>

    <!-- Globules -->
    <radialGradient id="pill" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FCF9F2"/>
      <stop offset="60%" stop-color="#EDE6D4"/>
      <stop offset="85%" stop-color="#DDD4BC"/>
      <stop offset="100%" stop-color="#C4B896"/>
    </radialGradient>
    <radialGradient id="pillShine" cx="28%" cy="20%" r="25%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="thinBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="350" rx="80" ry="12" fill="#0A2E2E" opacity="0.15" filter="url(#softShadow)"/>

  <!-- LEFT LEAF -->
  <g>
    <path d="M192,298 C148,298 68,278 30,194 C26,184 30,178 40,182 C116,208 174,242 192,298 Z" fill="url(#leafL)"/>
    <path d="M192,298 C164,290 124,270 96,244 C132,262 168,278 192,298 Z" fill="#0C2814" opacity="0.5" filter="url(#thinBlur)"/>
    <path d="M186,290 C152,254 104,220 46,190" fill="none" stroke="#C0E8AD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <g stroke="#C0E8AD" stroke-width="1.3" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M72,204 C80,214 83,226 81,236"/>
      <path d="M104,222 C112,234 115,244 113,256"/>
      <path d="M136,244 C143,254 146,264 144,274"/>
    </g>
    <path d="M42,184 C90,204 138,230 174,268 C130,238 84,208 42,184 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- RIGHT LEAF -->
  <g>
    <path d="M208,298 C252,298 332,278 370,194 C374,184 370,178 360,182 C284,208 226,242 208,298 Z" fill="url(#leafR)"/>
    <path d="M208,298 C236,290 276,270 304,244 C268,262 232,278 208,298 Z" fill="#0C2814" opacity="0.5" filter="url(#thinBlur)"/>
    <path d="M214,290 C248,254 296,220 354,190" fill="none" stroke="#C0E8AD" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <g stroke="#C0E8AD" stroke-width="1.3" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M328,204 C320,214 317,226 319,236"/>
      <path d="M296,222 C288,234 285,244 287,256"/>
      <path d="M264,244 C257,254 254,264 256,274"/>
    </g>
    <path d="M358,184 C310,204 262,230 226,268 C270,238 316,208 358,184 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- VIAL -->
  <g>
    <!-- Vial shadow on leaves -->
    <ellipse cx="200" cy="302" rx="34" ry="8" fill="#0A2E2E" opacity="0.25" filter="url(#softShadow)"/>

    <!-- Glass body: TRANSPARENT - only faint tint, visible through edges -->
    <!-- Very subtle interior fill to hint at glass existence -->
    <path d="M168,132 L232,132 L232,274 C232,290 218,300 200,300 C182,300 168,290 168,274 Z"
          fill="#B8E8E4" fill-opacity="0.06"/>

    <!-- Left edge (this is what makes glass visible - thick edge refraction) -->
    <path d="M168,132 L168,274 C168,290 182,300 200,300"
          fill="none" stroke="url(#glassEdgeL)" stroke-width="3"/>
    <!-- Right edge -->
    <path d="M232,132 L232,274 C232,290 218,300 200,300"
          fill="none" stroke="url(#glassEdgeR)" stroke-width="3"/>
    <!-- Top edge -->
    <line x1="168" y1="132" x2="232" y2="132" stroke="#0A5E5D" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- Bottom curve thickness (glass is thicker at the base) -->
    <path d="M170,278 C178,294 222,294 230,278 C222,298 178,298 170,278 Z" fill="url(#glassBottomCurve)"/>

    <!-- Primary left highlight streak (the key glass indicator) -->
    <path d="M176,140 C175,185 175,230 176,270" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" filter="url(#thinBlur)"/>
    <path d="M183,144 C182,190 182,230 183,264" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Thin secondary left highlight -->
    <path d="M172,155 C171,200 171,240 172,268" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

    <!-- Right subtle reflection -->
    <path d="M222,145 C223,190 223,235 222,268" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

    <!-- Top area sheen (glass catches light at top) -->
    <path d="M170,132 L230,132 L228,165 C215,170 185,170 172,165 Z" fill="url(#glassSheen)" opacity="0.2"/>

    <!-- Bottom caustic glow -->
    <path d="M185,288 C192,294 208,294 215,288" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.25" filter="url(#glow)"/>

    <!-- Globules inside (visible through the transparent glass) -->
    <g>
      <circle cx="187" cy="278" r="11.5" fill="url(#pill)"/>
      <circle cx="213" cy="280" r="11.5" fill="url(#pill)"/>
      <circle cx="200" cy="260" r="11.5" fill="url(#pill)"/>
      <circle cx="183" cy="273" r="4" fill="url(#pillShine)"/>
      <circle cx="209" cy="275" r="4" fill="url(#pillShine)"/>
      <circle cx="196" cy="255" r="4" fill="url(#pillShine)"/>
    </g>

    <!-- Neck shadow under cap -->
    <rect x="168" y="132" width="64" height="8" rx="2" fill="#063D3C" opacity="0.35"/>

    <!-- CAP -->
    <g>
      <rect x="158" y="86" width="84" height="50" rx="7" fill="url(#capBody)"/>
      <ellipse cx="200" cy="89" rx="42" ry="7.5" fill="url(#capTop)"/>
      <rect x="160" y="130" width="80" height="5" rx="2" fill="url(#capRim)"/>
      <!-- Ribs -->
      <g stroke="#032928" stroke-width="2" opacity="0.45">
        <line x1="172" y1="94" x2="172" y2="132"/>
        <line x1="184" y1="93" x2="184" y2="133"/>
        <line x1="196" y1="92" x2="196" y2="134"/>
        <line x1="208" y1="92" x2="208" y2="134"/>
        <line x1="220" y1="93" x2="220" y2="133"/>
        <line x1="232" y1="94" x2="232" y2="132"/>
      </g>
      <!-- Cap highlights -->
      <path d="M178,94 C178,106 178,118 178,130" stroke="#7EEAE4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <path d="M186,93 C186,105 186,117 186,131" stroke="#B4F5F1" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      <ellipse cx="192" cy="88" rx="16" ry="3" fill="#FFFFFF" opacity="0.2"/>
    </g>
  </g>

  <!-- SCATTERED GLOBULES -->
  <g>
    <!-- Shadows -->
    <ellipse cx="148" cy="342" rx="10" ry="3" fill="#0A2E2E" opacity="0.2" filter="url(#thinBlur)"/>
    <ellipse cx="178" cy="354" rx="10" ry="3" fill="#0A2E2E" opacity="0.2" filter="url(#thinBlur)"/>
    <ellipse cx="212" cy="358" rx="10" ry="3" fill="#0A2E2E" opacity="0.2" filter="url(#thinBlur)"/>
    <ellipse cx="246" cy="350" rx="10" ry="3" fill="#0A2E2E" opacity="0.2" filter="url(#thinBlur)"/>
    <ellipse cx="272" cy="336" rx="9" ry="2.5" fill="#0A2E2E" opacity="0.18" filter="url(#thinBlur)"/>

    <!-- Pills -->
    <circle cx="148" cy="334" r="12" fill="url(#pill)"/>
    <circle cx="178" cy="346" r="12" fill="url(#pill)"/>
    <circle cx="212" cy="350" r="12" fill="url(#pill)"/>
    <circle cx="246" cy="342" r="12" fill="url(#pill)"/>
    <circle cx="272" cy="328" r="10.5" fill="url(#pill)"/>

    <!-- Shines -->
    <circle cx="144" cy="329" r="4.2" fill="url(#pillShine)"/>
    <circle cx="174" cy="341" r="4.2" fill="url(#pillShine)"/>
    <circle cx="208" cy="345" r="4.2" fill="url(#pillShine)"/>
    <circle cx="242" cy="337" r="4.2" fill="url(#pillShine)"/>
    <circle cx="268" cy="323" r="3.6" fill="url(#pillShine)"/>
  </g>
</svg>
