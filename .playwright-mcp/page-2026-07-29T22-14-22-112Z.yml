        - text: Why Choose Us
        - heading "The homoeopathy difference" [level=2] [ref=e181]
        - paragraph [ref=e182]: Trusted by millions of families across India, homoeopathy offers gentle, individualised care focused on lasting wellbeing.
      - generic [ref=e183]:
        - generic [ref=e185]:
          - heading "A time-tested science" [level=3] [ref=e190]
          - paragraph [ref=e191]: Homoeopathy was founded by Dr. Samuel Hahnemann in 1796 and has been practised for over 200 years. It is based on the principle of 'Similia Similibus Curentur' — like cures like.
        - generic [ref=e193]:
          - heading "Recognised in India" [level=3] [ref=e198]
          - paragraph [ref=e199]: Homoeopathy is an official system of medicine in India under the Ministry of AYUSH. India has one of the largest networks of homoeopathic doctors, colleges, and hospitals in the world.
        - generic [ref=e201]:
          - heading "Gentle and safe" [level=3] [ref=e206]
          - paragraph [ref=e207]: Remedies are prepared from natural sources and given in highly diluted doses. When prescribed correctly, they are safe for infants, pregnant women, and the elderly.
        - generic [ref=e209]:
          - heading "Treats the whole person" [level=3] [ref=e214]
          - paragraph [ref=e215]: A homoeopath studies your physical, mental, and emotional state before selecting a remedy. The goal is long-term health, not short-term relief.
