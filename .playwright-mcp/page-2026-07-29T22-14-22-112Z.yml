          - paragraph [ref=e95]: Dr. Sheetal holds a BHMS (Bachelor of Homoeopathic Medicine and Surgery) and an MD in Homoeopathy. She is a registered homoeopathic physician who practises classical homoeopathy, where one remedy is carefully selected after a detailed study of the patient.
